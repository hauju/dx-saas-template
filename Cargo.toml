[package]
name = "dx-saas-template"
version.workspace = true
authors.workspace = true
edition.workspace = true

[workspace]
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Hauke Jung <hauke.jung@outlook.de>"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.17"
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }

[dependencies]
# Framework
dioxus = { version = "0.7.3", features = ["router", "fullstack"] }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { version = "0.3.2", default-features = false, features = [
    "env-filter",
    "fmt",
    "json",
] }

# Async
futures = "0.3.3"

# Date/time
chrono = { workspace = true }

# Icons
dioxus-free-icons = { version = "0.10.0", features = ["lucide"] }

# Documentation
dioxus-docs-kit = { version = "0.3", default-features = false }

# Workspace crates
auth = { path = "crates/auth", optional = true }
crypto = { path = "crates/crypto", optional = true }
smtp = { path = "crates/smtp", optional = true }
polar = { path = "crates/polar", optional = true }

# Server dependencies
mongodb = { version = "3.1.0", optional = true }
bson = { version = "2.13", features = ["chrono-0_4"], optional = true }
axum = { version = "0.8", optional = true }
tokio = { version = "1", features = ["rt", "time"], optional = true }
tower-sessions = { version = "0.14", features = ["signed"], optional = true }
tower-sessions-redis-store = { version = "0.16", optional = true }
tower-http = { version = "0.6", features = ["compression-gzip"], optional = true }
dotenvy = { version = "0.15", optional = true }
secrecy = { version = "0.10", optional = true }
hex = { version = "0.4", optional = true }
async-trait = { version = "0.1", optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring"], optional = true }

# Web dependencies
gloo-timers = { version = "0.3.0", features = ["futures"], optional = true }

[features]
default = ["web"]
web = ["dioxus/web", "auth/web", "dep:gloo-timers", "dioxus-docs-kit/web"]
server = [
    "dioxus/server",
    "dep:mongodb",
    "dep:bson",
    "dep:axum",
    "dep:tokio",
    "dep:tower-sessions",
    "dep:tower-sessions-redis-store",
    "dep:tower-http",
    "dep:dotenvy",
    "dep:secrecy",
    "dep:hex",
    "dep:async-trait",
    "dep:auth",
    "auth/server",
    "dep:crypto",
    "dep:smtp",
    "dep:polar",
    "dep:rustls",
]

[build-dependencies]
dioxus-docs-kit-build = "0.3"
