[package]
name = "auth"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Authentication and authorization (FerrisKey OIDC, custom login UI, WebAuthn)"

[dependencies]
# Workspace crates (server-only)
crypto = { path = "../crypto", optional = true }

# Serialization (always needed for shared types)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = { version = "2.0", default-features = false }

# Server dependencies
async-trait = { version = "0.1", optional = true }
axum = { version = "0.8.8", optional = true }
tower-sessions = { version = "0.14", default-features = false, features = [
    "axum-core",
], optional = true }
reqwest = { version = "0.13.1", features = [
    "json",
    "query",
    "form",
], optional = true }
tracing = { version = "0.1", optional = true }
jsonwebtoken = { version = "10", features = ["aws_lc_rs"], optional = true }
sha2 = { version = "0.10", optional = true }
base64 = { version = "0.22", optional = true }
governor = { version = "0.10", optional = true, features = ["std"] }
chrono = { version = "0.4.43", default-features = false, features = [
    "std",
    "now",
    "serde",
], optional = true }
url = { version = "2.5", optional = true }
captcha-rs = { version = "0.5", optional = true }

# Web dependencies (login page component)
dioxus = { version = "0.7.9", features = ["fullstack", "lib"], optional = true }
web-sys = { version = "0.3", optional = true, features = [
    "Window",
    "Request",
    "RequestInit",
    "RequestCredentials",
    "Response",
    "Headers",
] }
js-sys = { version = "0.3", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }
gloo-timers = { version = "0.3.0", features = ["futures"], optional = true }
subtle = "2.6.1"

[features]
default = []
server = [
    "dep:dioxus",
    "dep:async-trait",
    "dep:axum",
    "dep:tower-sessions",
    "dep:reqwest",
    "dep:tracing",
    "dep:chrono",
    "dep:url",
    "dep:crypto",
    "dep:governor",
    "dep:captcha-rs",
    "dep:jsonwebtoken",
    "dep:sha2",
    "dep:base64",
]
web = [
    "dep:dioxus",
    "dep:web-sys",
    "dep:js-sys",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:serde-wasm-bindgen",
    "dep:gloo-timers",
]
