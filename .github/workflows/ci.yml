name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt / clippy / machete
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          # rust-toolchain.toml pins the channel; this just ensures components are present.
          toolchain: 1.94.0
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Node deps
        run: bun install --frozen-lockfile

      - name: Build Tailwind
        run: bunx @tailwindcss/cli -i tailwind.css -o assets/tailwind.css

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Install cargo-machete
        uses: bnjbvr/cargo-machete@main

      - name: cargo machete
        run: cargo machete

  test:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0

      - uses: Swatinem/rust-cache@v2

      - name: cargo test (workspace crates)
        run: cargo test --workspace --exclude dx-saas-template

      # The app crate is excluded above because a bare --workspace build resolves
      # it with its default (wasm client) feature, which can't run as a test
      # binary. Its tests cover the OAuth redirect-URI allowlist, proxy-header
      # trust, and HSTS gating, so run them explicitly against the server feature.
      - name: cargo test (app crate, server feature)
        run: cargo test -p dx-saas-template --no-default-features --features server

  audit:
    name: cargo audit (vulnerable deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: cargo audit
        run: cargo audit
